
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>220 × 100 mm Name Tag Generator</title>

<!-- Excel Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* GLOBAL */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans Devanagari", "Mangal", sans-serif;
    background: #f1f5f9;
    color: #111827;
}

button, input, select { font-family: inherit; }
button { cursor: pointer; }

/* APP LAYOUT */
.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
    width: 360px;
    background: #ffffff;
    border-right: 1px solid #dbe2ea;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 4px 0 20px rgba(15, 23, 42, 0.06);
}

.sidebar-header {
    padding: 22px;
    border-bottom: 1px solid #e5e7eb;
    background: linear-gradient(135deg, #172554, #1e40af);
    color: white;
}

.sidebar-header h1 { font-size: 20px; margin: 0 0 5px; }
.sidebar-header p { margin: 0; font-size: 12px; opacity: .8; }
.sidebar-content { padding: 18px; }
.section { margin-bottom: 20px; }

.section-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 10px;
    letter-spacing: .5px;
}

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
.field input, .field select {
    width: 100%; height: 40px;
    border: 1px solid #cbd5e1; border-radius: 8px;
    padding: 0 11px; font-size: 14px;
    background: white; outline: none;
}

.field input:focus, .field select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

/* BUTTONS */
.btn {
    border: 0; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; font-weight: 700;
    transition: .15s;
}

.btn:hover { transform: translateY(-1px); filter: brightness(.97); }
.btn-primary { background: #2563eb; color: white; }
.btn-success { background: #16a34a; color: white; }
.btn-danger { background: #dc2626; color: white; }
.btn-warning { background: #f59e0b; color: #111827; }
.btn-secondary { background: #64748b; color: white; }
.btn-light { background: #e2e8f0; color: #1e293b; }
.btn-info { background: #0891b2; color: white; }
.btn-purple { background: #7c3aed; color: white; }
.btn-block { width: 100%; }
.button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* RANGE */
.range-row { display: flex; align-items: center; gap: 8px; }
.range-row input[type="range"] { flex: 1; }
.range-value {
    width: 55px; text-align: center;
    font-size: 12px; font-weight: 700;
    background: #f1f5f9; padding: 5px; border-radius: 6px;
}

/* MAIN */
.main { margin-left: 360px; flex: 1; min-width: 0; }
.topbar {
    position: sticky; top: 0; z-index: 50; height: 70px;
    background: rgba(255,255,255,.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 25px;
}

.topbar-title { font-size: 18px; font-weight: 800; }
.topbar-actions { display: flex; gap: 8px; }
.workspace { padding: 25px; }

/* CARDS */
.card {
    background: white; border: 1px solid #e2e8f0;
    border-radius: 14px; box-shadow: 0 5px 20px rgba(15,23,42,.05);
    margin-bottom: 20px;
}

.card-header {
    padding: 15px 18px; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
}

.card-header h2 { font-size: 15px; margin: 0; }
.card-body { padding: 18px; }

/* TABLE */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
    border-bottom: 1px solid #e2e8f0; padding: 11px;
    text-align: left; font-size: 13px; vertical-align: middle;
}
th { background: #f8fafc; color: #475569; font-size: 12px; }
tr:hover td { background: #f8fafc; }
.action-buttons { display: flex; gap: 5px; }
.action-buttons .btn { padding: 6px 9px; font-size: 11px; }

/* PREVIEW AREA */
.preview-area {
    background:
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border-radius: 12px; padding: 30px; overflow: auto;
}

.preview-label { text-align: center; color: #64748b; font-size: 12px; font-weight: 700; margin-bottom: 15px; }

/* TAG LAYOUT */
.tag {
    width: 220mm; height: 100mm;
    background: #ffffff; position: relative;
    overflow: hidden; margin: 0 auto 25px;
    border: 1.1mm solid #1f2937;
    box-shadow: 0 12px 35px rgba(15,23,42,.20);
    flex-shrink: 0;
    page-break-after: always;
    break-after: page;
}

.tag-inner {
    position: absolute;
    left: var(--safe-margin, 10mm); right: var(--safe-margin, 10mm);
    top: var(--safe-margin, 10mm); bottom: var(--safe-margin, 10mm);
    display: flex; justify-content: center; align-items: center;
    overflow: visible;
}

.tag-content {
    width: 100%; max-width: 100%; text-align: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}

.name-text { font-weight: 900; line-height: 1.05; white-space: nowrap; max-width: 100%; color: #000000; }
.designation-text { font-weight: 800; line-height: 1.1; max-width: 100%; color: #1f2937; }
.office-text { font-weight: 800; line-height: 1.08; max-width: 100%; color: #374151; }

.divider {
    display: flex; align-items: center; justify-content: center;
    width: 45%; margin: 3mm auto 3mm; gap: 6px;
}

.divider-line { height: .45mm; background: #777; flex: 1; }
.divider-diamond { width: 2mm; height: 2mm; background: #777; transform: rotate(45deg); }

/* CORNERS */
.corner { position: absolute; width: 17mm; height: 17mm; background: #262626; z-index: 3; }
.corner::after { content: ""; position: absolute; width: 8mm; height: 8mm; background: white; }
.corner.tl { top: -8mm; left: -8mm; transform: rotate(45deg); }
.corner.tl::after { bottom: -1mm; right: -1mm; }
.corner.tr { top: -8mm; right: -8mm; transform: rotate(45deg); }
.corner.tr::after { bottom: -1mm; left: -1mm; }
.corner.bl { bottom: -8mm; left: -8mm; transform: rotate(45deg); }
.corner.bl::after { top: -1mm; right: -1mm; }
.corner.br { bottom: -8mm; right: -8mm; transform: rotate(45deg); }
.corner.br::after { top: -1mm; left: -1mm; }

/* DESIGNS */
.tag.design-classic { border: 1.1mm solid #111827; }
.tag.design-minimal { border: .6mm solid #334155; }
.tag.design-minimal .corner { display: none; }
.tag.design-double { border: .7mm solid #111827; }
.tag.design-double::before { content: ""; position: absolute; inset: 3mm; border: .35mm solid #6b7280; pointer-events: none; }
.tag.design-modern { border: 0; }
.tag.design-modern::before { content: ""; position: absolute; inset: 4mm; border: .5mm solid #111827; pointer-events: none; }
.tag.design-modern .corner { width: 14mm; height: 14mm; background: #111827; }

.status { padding: 9px 11px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; display: none; }
.status.show { display: block; }
.status.success { background: #dcfce7; color: #166534; }
.status.error { background: #fee2e2; color: #991b1b; }
.status.info { background: #dbeafe; color: #1e40af; }
.empty-state { padding: 35px; text-align: center; color: #94a3b8; }

#printContainer { display: none; }

@media screen {
    #printContainer { display: none !important; }
}

@page { size: 220mm 100mm; margin: 0; }

@media print {
    .app, .no-print { display: none !important; }
    #printContainer {
        display: block !important;
        width: 220mm !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    .tag {
        box-shadow: none !important;
        margin: 0 !important;
        width: 220mm !important;
        height: 100mm !important;
    }
}
</style>
</head>

<body>

<div class="app">
<aside class="sidebar no-print">
    <div class="sidebar-header">
        <h1>220 × 100 mm Name Tag</h1>
        <p>Name Tag / Name Plate Generator</p>
    </div>

    <div class="sidebar-content">
        <div class="section">
            <div class="section-title">Member Information</div>
            <div id="status" class="status"></div>
            <div class="field">
                <label>Full Name / पूरा नाम</label>
                <input type="text" id="nameInput" placeholder="जस्तै: दिनेश महतरा">
            </div>
            <div class="field">
                <label>Designation / पद</label>
                <input type="text" id="designationInput" placeholder="जस्तै: सहसचिव">
            </div>
            <div class="field">
                <label>Organization / Office / कार्यालय</label>
                <input type="text" id="officeInput" placeholder="जस्तै: सङ्घीय संसद् सचिवालय">
            </div>
            <div class="button-grid">
                <button class="btn btn-primary" id="saveBtn" onclick="saveEntry()">+ Add Entry</button>
                <button class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Design</div>
            <div class="field">
                <label>Tag Design</label>
                <select id="designSelect">
                    <option value="classic">Classic Corner</option>
                    <option value="double">Double Border</option>
                    <option value="modern">Modern</option>
                    <option value="minimal">Minimal</option>
                </select>
            </div>
            <div class="field">
                <label>Font Family</label>
                <select id="fontSelect">
                    <option value='"Noto Sans Devanagari", Arial, sans-serif'>Noto Sans Devanagari</option>
                    <option value='"Mangal", Arial, sans-serif'>Mangal</option>
                    <option value='"Kalimati", Arial, sans-serif'>Kalimati</option>
                    <option value='"Arial", sans-serif'>Arial</option>
                    <option value='"Times New Roman", serif'>Times New Roman</option>
                    <option value='"Georgia", serif'>Georgia</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Font Settings</div>
            <div class="field">
                <label>Name Maximum Size</label>
                <div class="range-row">
                    <input type="range" id="nameSize" min="28" max="100" value="72">
                    <span class="range-value" id="nameSizeValue">72pt</span>
                </div>
            </div>
            <div class="field">
                <label>Designation Maximum Size</label>
                <div class="range-row">
                    <input type="range" id="designationSize" min="18" max="65" value="40">
                    <span class="range-value" id="designationSizeValue">40pt</span>
                </div>
            </div>
            <div class="field">
                <label>Office Maximum Size</label>
                <div class="range-row">
                    <input type="range" id="officeSize" min="16" max="60" value="36">
                    <span class="range-value" id="officeSizeValue">36pt</span>
                </div>
            </div>
            <div class="field">
                <label>Safe Margin</label>
                <div class="range-row">
                    <input type="range" id="safeMargin" min="4" max="18" value="10">
                    <span class="range-value" id="safeMarginValue">10mm</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Data</div>
            <div class="button-grid">
                <button class="btn btn-success" onclick="printSelected()">🖨 Print Selected</button>
                <button class="btn btn-info" onclick="exportExcel()">↓ Export Excel</button>
            </div>
            <br>
            <button class="btn btn-purple btn-block" onclick="document.getElementById('excelFile').click()">↑ Import Excel</button>
            <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="importExcel(event)">
            <br>
            <button class="btn btn-danger btn-block" onclick="clearAllData()">Clear All Data</button>
        </div>

        <div class="section">
            <div class="section-title">Selection</div>
            <div class="button-grid">
                <button class="btn btn-light" onclick="selectAll()">Select All</button>
                <button class="btn btn-light" onclick="clearSelection()">Clear Selection</button>
            </div>
        </div>
    </div>
</aside>

<main class="main">
    <header class="topbar no-print">
        <div class="topbar-title">Name Tag Generator</div>
        <div class="topbar-actions">
            <button class="btn btn-primary" onclick="printSelected()">🖨 Print Selected</button>
        </div>
    </header>

    <div class="workspace">
        <div class="card no-print">
            <div class="card-header">
                <h2>Saved Members / बचत गरिएका नामहरू</h2>
                <div style="width:240px">
                    <input id="searchInput" placeholder="Search..." oninput="renderTable()" style="width:100%; height:34px; border:1px solid #cbd5e1; border-radius:7px; padding:0 10px;">
                </div>
            </div>
            <div class="card-body">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:45px"><input type="checkbox" id="masterCheckbox" onchange="toggleMaster(this)"></th>
                                <th>Name</th>
                                <th>Designation</th>
                                <th>Organization</th>
                                <th style="width:150px">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="memberTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header no-print">
                <h2>Live Preview</h2>
                <span style="font-size:12px; color:#64748b;">Actual size: 220 × 100 mm</span>
            </div>
            <div class="card-body preview-area">
                <div class="preview-label no-print">LIVE PREVIEW</div>
                <div id="previewContainer"></div>
            </div>
        </div>
    </div>
</main>
</div>

<!-- PRINT CONTAINER -->
<div id="printContainer"></div>

<script>
let members = [];
let editingIndex = -1;
let selectedIds = new Set();

const nameInput = document.getElementById("nameInput");
const designationInput = document.getElementById("designationInput");
const officeInput = document.getElementById("officeInput");
const designSelect = document.getElementById("designSelect");
const fontSelect = document.getElementById("fontSelect");
const nameSize = document.getElementById("nameSize");
const designationSize = document.getElementById("designationSize");
const officeSize = document.getElementById("officeSize");
const safeMargin = document.getElementById("safeMargin");

function loadData() {
    try {
        const saved = localStorage.getItem("nameTagMembers");
        if (saved) members = JSON.parse(saved);
    } catch (error) { members = []; }
}

function saveData() {
    localStorage.setItem("nameTagMembers", JSON.stringify(members));
}

function showStatus(message, type = "info") {
    const status = document.getElementById("status");
    status.textContent = message;
    status.className = "status show " + type;
    clearTimeout(window.statusTimer);
    window.statusTimer = setTimeout(() => { status.classList.remove("show"); }, 3000);
}

function escapeHTML(value) {
    return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function saveEntry() {
    const name = nameInput.value.trim();
    const designation = designationInput.value.trim();
    const office = officeInput.value.trim();

    if (!name) {
        showStatus("Please enter a name.", "error");
        nameInput.focus();
        return;
    }

    const newId = editingIndex >= 0 ? members[editingIndex].id : Date.now().toString();
    const record = { id: newId, name, designation, office };

    if (editingIndex >= 0) {
        members[editingIndex] = record;
        showStatus("Entry updated successfully.", "success");
    } else {
        members.push(record);
        selectedIds.add(newId); // Automatically select newly added entries
        showStatus("Entry added successfully.", "success");
    }

    saveData();
    editingIndex = -1;
    updateSaveButton();
    clearForm();
    renderTable();
    renderPreview();
}

function editEntry(index) {
    if (!members[index]) return;
    const member = members[index];
    nameInput.value = member.name || "";
    designationInput.value = member.designation || "";
    officeInput.value = member.office || "";
    editingIndex = index;
    updateSaveButton();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteEntry(index) {
    if (!members[index]) return;
    if (!confirm(`Delete "${members[index].name}"?`)) return;
    selectedIds.delete(members[index].id);
    members.splice(index, 1);
    saveData();
    renderTable();
    renderPreview();
    showStatus("Entry deleted.", "success");
}

function cancelEdit() {
    editingIndex = -1;
    clearForm();
    updateSaveButton();
}

function clearForm() {
    nameInput.value = "";
    designationInput.value = "";
    officeInput.value = "";
}

function updateSaveButton() {
    const btn = document.getElementById("saveBtn");
    btn.textContent = editingIndex >= 0 ? "✓ Update Entry" : "+ Add Entry";
}

function renderTable() {
    const tbody = document.getElementById("memberTable");
    const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();

    const filtered = members.map((member, index) => ({ member, index }))
        .filter(item => (item.member.name + " " + item.member.designation + " " + item.member.office).toLowerCase().includes(search));

    if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">No saved members found.</div></td></tr>`;
        updateMasterCheckbox();
        return;
    }

    tbody.innerHTML = filtered.map(item => {
        const m = item.member;
        const checked = selectedIds.has(m.id) ? "checked" : "";
        return `
        <tr>
            <td><input type="checkbox" ${checked} onchange="toggleMember('${m.id}', this.checked)"></td>
            <td><strong>${escapeHTML(m.name)}</strong></td>
            <td>${escapeHTML(m.designation)}</td>
            <td>${escapeHTML(m.office)}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-warning" onclick="editEntry(${item.index})">Edit</button>
                    <button class="btn btn-danger" onclick="deleteEntry(${item.index})">Delete</button>
                </div>
            </td>
        </tr>`;
    }).join("");

    updateMasterCheckbox();
}

function toggleMember(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    updateMasterCheckbox();
    renderPreview();
}

function toggleMaster(checkbox) {
    if (checkbox.checked) members.forEach(m => selectedIds.add(m.id));
    else selectedIds.clear();
    renderTable();
    renderPreview();
}

function selectAll() {
    members.forEach(m => selectedIds.add(m.id));
    renderTable();
    renderPreview();
}

function clearSelection() {
    selectedIds.clear();
    renderTable();
    renderPreview();
}

function updateMasterCheckbox() {
    const master = document.getElementById("masterCheckbox");
    if (!members.length) { master.checked = false; master.indeterminate = false; return; }
    const selectedCount = members.filter(m => selectedIds.has(m.id)).length;
    master.checked = selectedCount === members.length;
    master.indeterminate = selectedCount > 0 && selectedCount < members.length;
}

function updateRangeLabels() {
    document.getElementById("nameSizeValue").textContent = nameSize.value + "pt";
    document.getElementById("designationSizeValue").textContent = designationSize.value + "pt";
    document.getElementById("officeSizeValue").textContent = officeSize.value + "pt";
    document.getElementById("safeMarginValue").textContent = safeMargin.value + "mm";
}

[nameSize, designationSize, officeSize, safeMargin, designSelect, fontSelect].forEach(el => {
    el.addEventListener("input", () => { updateRangeLabels(); renderPreview(); });
});

[nameInput, designationInput, officeInput].forEach(el => {
    el.addEventListener("input", renderPreview);
});

updateRangeLabels();

function createTag(member) {
    const tag = document.createElement("div");
    tag.className = "tag design-" + designSelect.value;
    tag.style.setProperty("--safe-margin", safeMargin.value + "mm");
    tag.dataset.id = member.id || "";

    tag.innerHTML = `
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="tag-inner">
            <div class="tag-content">
                <div class="name-text" data-role="name">${escapeHTML(member.name)}</div>
                <div class="divider" data-role="divider">
                    <div class="divider-line"></div>
                    <div class="divider-diamond"></div>
                    <div class="divider-line"></div>
                </div>
                <div class="designation-text" data-role="designation">${escapeHTML(member.designation)}</div>
                <div class="office-text" data-role="office">${escapeHTML(member.office)}</div>
            </div>
        </div>
    `;

    tag.style.fontFamily = fontSelect.value;
    return tag;
}

function fitText(tag) {
    const content = tag.querySelector(".tag-content");
    const name = tag.querySelector('[data-role="name"]');
    const designation = tag.querySelector('[data-role="designation"]');
    const office = tag.querySelector('[data-role="office"]');

    let nameFont = Number(nameSize.value);
    let designationFont = Number(designationSize.value);
    let officeFont = Number(officeSize.value);

    name.style.fontSize = nameFont + "pt";
    designation.style.fontSize = designationFont + "pt";
    office.style.fontSize = officeFont + "pt";

    designation.style.display = designation.textContent.trim() ? "" : "none";
    office.style.display = office.textContent.trim() ? "" : "none";

    const availableWidth = tag.querySelector(".tag-inner").clientWidth || 750;
    const availableHeight = tag.querySelector(".tag-inner").clientHeight || 340;

    let attempts = 0;
    while (attempts < 250 && (content.scrollWidth > availableWidth + 1 || content.scrollHeight > availableHeight + 1)) {
        attempts++;
        nameFont *= 0.965;
        designationFont *= 0.965;
        officeFont *= 0.965;

        nameFont = Math.max(nameFont, 22);
        designationFont = Math.max(designationFont, 15);
        officeFont = Math.max(officeFont, 14);

        name.style.fontSize = nameFont + "pt";
        designation.style.fontSize = designationFont + "pt";
        office.style.fontSize = officeFont + "pt";
    }

    return tag;
}

function getActiveList() {
    const selected = members.filter(m => selectedIds.has(m.id));
    if (selected.length > 0) return selected;

    if (nameInput.value.trim()) {
        return [{ id: "preview", name: nameInput.value.trim(), designation: designationInput.value.trim(), office: officeInput.value.trim() }];
    }

    return [];
}

function renderPreview() {
    const container = document.getElementById("previewContainer");
    const activeList = getActiveList();

    container.innerHTML = "";
    if (!activeList.length) {
        container.innerHTML = `<div class="empty-state no-print">No items selected. Select checkboxes in the table above or enter details to preview.</div>`;
        return;
    }

    activeList.forEach(member => {
        const tag = createTag(member);
        container.appendChild(tag);
        fitText(tag);
    });
}

function printSelected() {
    const activeList = getActiveList();

    if (!activeList.length) {
        showStatus("Please select at least one entry from the table to print.", "error");
        return;
    }

    printMembers(activeList);
}

function printMembers(list) {
    const printArea = document.getElementById("printContainer");
    printArea.innerHTML = "";

    list.forEach(member => {
        const tag = createTag(member);
        printArea.appendChild(tag);
        fitText(tag);
    });

    setTimeout(() => {
        window.print();
    }, 150);
}

function importExcel(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (typeof XLSX === "undefined") {
        showStatus("Excel library could not be loaded.", "error");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

            let imported = 0;
            rows.forEach(row => {
                const name = getExcelValue(row, ["Name", "name", "Full Name", "Full Name / पूरा नाम", "पूरा नाम"]).trim();
                const designation = getExcelValue(row, ["Designation", "designation", "Post", "पद"]).trim();
                const office = getExcelValue(row, ["Organization", "organization", "Office", "Organization / Office", "कार्यालय"]).trim();

                if (name) {
                    const newId = Date.now().toString() + "-" + Math.random().toString(36).substring(2,8);
                    members.push({ id: newId, name, designation, office });
                    selectedIds.add(newId);
                    imported++;
                }
            });

            saveData(); renderTable(); renderPreview();
            showStatus(`${imported} member(s) imported and selected successfully.`, "success");
        } catch(error) { showStatus("Could not read Excel file.", "error"); }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = "";
}

function getExcelValue(row, keys) {
    for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(row, key)) return String(row[key] || "");
    }
    const rowKeys = Object.keys(row);
    for (const wanted of keys) {
        const found = rowKeys.find(key => key.toLowerCase() === wanted.toLowerCase());
        if (found) return String(row[found] || "");
    }
    return "";
}

function exportExcel() {
    if (!members.length) { showStatus("There is no data to export.", "error"); return; }
    const rows = members.map((m, i) => ({ "S.N.": i + 1, "Name": m.name, "Designation": m.designation, "Organization": m.office }));
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = [{ width:10 }, { width:35 }, { width:30 }, { width:60 }];
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Name Tags");
    XLSX.writeFile(workbook, "Name_Tags.xlsx");
    showStatus("Excel file exported successfully.", "success");
}

function clearAllData() {
    if (!members.length) return;
    if (!confirm("Are you sure you want to delete all saved members?")) return;
    members = []; selectedIds.clear(); editingIndex = -1;
    saveData(); clearForm(); updateSaveButton(); renderTable(); renderPreview();
    showStatus("All data has been cleared.", "success");
}

document.addEventListener("keydown", function(event) {
    if (event.ctrlKey && event.key === "Enter") { event.preventDefault(); saveEntry(); }
    if (event.ctrlKey && event.key.toLowerCase() === "p") { event.preventDefault(); printSelected(); }
});

loadData(); renderTable(); renderPreview();
</script>
